name: Release

# Runs on the merge itself. The iOS builds and the review are not repeated
# here, because the ruleset requires a pull request to be up to date with main
# before it can merge, so they ran against this same content. The tests are
# repeated, because a published version is permanent and the known-answer
# tests are what make it trustworthy. Nothing is published unless they pass
# and the XCFramework verifies.
on:
  push:
    branches: [main]
  # A change to how the package is assembled rather than to what it contains,
  # correcting the notices shipped alongside the binary say, is not visible to
  # the path rule in the script. Run this by hand to publish one.
  workflow_dispatch:

permissions:
  contents: write

# Version numbers come from the existing tags, so two releases must not be
# computed at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: XCFramework release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # The ACVP and X-Wing known-answer tests are the strongest correctness
      # evidence in the repository, and a published version is permanent. They
      # run here against the exact commit being released, even though the same
      # tests already passed on the pull request.
      - name: Run tests
        run: swift test

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          # A manual run skips the path rule, but still has to build and pass
          # verification before anything is published.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: Scripts/publish-release.sh
