name: Release

# Triggered by a successful CI run rather than by the merge itself, so a
# release can only come from a commit whose tests, iOS build, and XCFramework
# verification all passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A change to how the package is assembled rather than to what it contains,
  # correcting the notices shipped alongside the binary say, is not visible to
  # the path rule below. Run this by hand to publish one.
  workflow_dispatch:

permissions:
  contents: write

# Version numbers come from the existing tags, so two releases must not be
# computed at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: XCFramework release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # A manual run skips the path rule, but still has to build and pass
          # verification before anything is published.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: Scripts/publish-release.sh
