name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build for iOS
        run: xcodebuild -scheme CryptoPQ -destination 'generic/platform=iOS' build
      - name: Build the iOS demo
        run: xcodebuild -project Examples/CryptoPQDemo/CryptoPQDemo.xcodeproj -scheme CryptoPQDemo -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
