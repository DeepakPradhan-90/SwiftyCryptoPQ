name: CI

# Pull requests only. A merge does not re-run these, because the ruleset
# requires a pull request to be up to date with main before merging, so these
# checks already ran against the content main ends up with. Repeating them
# would spend macOS minutes to learn nothing.
on:
  pull_request:

permissions:
  contents: read

# A superseded run tells you about code nobody is going to merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build for iOS
        run: xcodebuild -scheme SwiftyCryptoPQ -destination 'generic/platform=iOS' build
      - name: Build the iOS demo
        run: xcodebuild -project Examples/CryptoPQDemo/CryptoPQDemo.xcodeproj -scheme CryptoPQDemo -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  # Releases ship a precompiled binary, so packaging is verified here rather
  # than discovered after a merge.
  xcframework:
    name: XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the XCFramework
        run: Scripts/make-xcframework.sh build/CryptoPQ.xcframework
      - name: Verify it works
        run: Scripts/verify-xcframework.sh build/CryptoPQ.xcframework

  review:
    name: Code review
    # Runs even when the checks above fail, because the review reports their
    # result. A fork pull request has neither the secret nor write access.
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [test, build-ios, xcframework]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/review/package-lock.json
      - name: Install the review agent
        working-directory: .github/review
        run: npm ci
      - name: Review the pull request
        working-directory: .github/review
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-ios.result }}
          XCFRAMEWORK_RESULT: ${{ needs.xcframework.result }}
        run: node review-pr.mjs
